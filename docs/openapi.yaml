        notifications:
          type: object
          properties:
            emailEnabled:
              type: boolean
    AdminSystemLoggingSettings:
      type: object
      required: [level, retentionDays, directory]
      properties:
        level:
          type: string
          enum: [error, warn, info, debug]
        retentionDays:
          type: integer
          minimum: 1
          maximum: 3650
        directory:
          type: string
    AdminSystemIpRegionDatabase:
      type: object
      required: [dbPath, sources]
      properties:
        dbPath:
          type: string
        sources:
          type: array
          items:
            type: string
            format: uri
    AdminSystemIpRegionSettings:
      type: object
      required: [enabled, cachePolicy, precision, autoUpdate, ipv4, ipv6]
      properties:
        enabled:
          type: boolean
        cachePolicy:
          type: string
          enum: [file, vectorIndex, content]
        precision:
          type: string
          enum: [country, province, city]
        autoUpdate:
          type: object
          required: [enabled, schedule]
          properties:
            enabled:
              type: boolean
            schedule:
              type: string
              enum: [monthly]
        ipv4:
          $ref: '#/components/schemas/AdminSystemIpRegionDatabase'
        ipv6:
          $ref: '#/components/schemas/AdminSystemIpRegionDatabase'
    AdminSystemSettingsResponse:
      type: object
      required: [logging, ipRegion]
      properties:
        logging:
          $ref: '#/components/schemas/AdminSystemLoggingSettings'
        ipRegion:
          $ref: '#/components/schemas/AdminSystemIpRegionSettings'
    AdminSystemSettingsUpdateRequest:
      type: object
      required: [logging]
      properties:
        logging:
          type: object
          required: [level, retentionDays]
          properties:
            level:
              type: string
              enum: [error, warn, info, debug]
            retentionDays:
              type: integer
              minimum: 1
              maximum: 3650
        ipRegion:
          $ref: '#/components/schemas/AdminSystemIpRegionSettings'
    AdminSiteCreateRequest:
      type: object
