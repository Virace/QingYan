            defaultStatus:
              type: string
              enum: [pending, approved]
            maxDepth:
              type: integer
              minimum: 1
            rootLimit:
              type: integer
              minimum: 1
            identity:
              type: object
              properties:
                require:
                  type: array
                  items:
                    type: string
                    enum: [nickname, email, website]
            allowWebsite:
              type: boolean
            captcha:
              type: object
              properties:
                mode:
                  type: string
                  enum: [never, always, threshold]
                thresholdWindowSec:
                  type: integer
                  minimum: 1
                thresholdMaxActions:
                  type: integer
                  minimum: 1
            abuseGuard:
              type: object
              properties:
                enabled:
                  type: boolean
                windowSec:
                  type: integer
                  minimum: 1
                maxWriteActions:
                  type: integer
                  minimum: 1
                autoBlacklist:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    scope:
                      type: string
                      enum: [post, all]
                    ttlSec:
                      type: integer
                      minimum: 1
            metadata:
              type: object
              properties:
                collectIp:
                  type: boolean
                collectUserAgent:
                  type: boolean
                ipRegion:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    precision:
                      type: string
                      enum: [country, province, city]
                device:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    display:
                      type: object
                      properties:
                        enabled:
                          type: boolean
        pageFeedback:
          type: object
          properties:
            allowLike:
