    CreateCommentRequest:
      type: object
      required:
        - siteKey
        - pageTitle
        - parentCommentId
        - author
        - content
      properties:
        siteKey:
          type: string
        pageKey:
          type: string
          description: Dev/mock compatibility field. Normal public requests derive the page key from the allowed Referer header and ignore explicit page identity.
        pageTitle:
          type: string
        pageUrl:
          oneOf:
            - type: string
              format: uri
            - type: string
              pattern: ^/
          description: Dev/mock compatibility field. Normal public requests derive and store the page path from the allowed Referer header and ignore explicit page identity.
        parentCommentId:
          type:
            - string
            - 'null'
        author:
          type: object
          description: Author fields submitted by an ordinary commenter or by a verified-author frontend flow. Public frontends may store successful ordinary author fields in their own origin storage for later form prefill; this is a frontend convenience, not authentication.
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            website:
              type: string
              format: uri
        content:
          type: object
          required: [raw]
          properties:
            raw:
              type: string
        options:
          type: object
          description: Optional create options. `notifyOnReply` updates the ordinary commenter's per-site reply email preference when the submitted author email passes notification email policy. It does not affect staff/admin comments.
          properties:
            notifyOnReply:
              type: boolean
        captcha:
          oneOf:
            - $ref: '#/components/schemas/InlineCaptchaPayload'
            - type: 'null'
    CreateCommentResponse:
