openapi: 3.1.0
info:
  title: QingYan API
  version: 0.1.0
  description: |
    QingYan 是一个面向内容站点的第一方评论后端。

    当前规格以仓库内已经实现并通过自动化验证的接口为准，覆盖公开评论接口、页面点赞接口、验证码接口和后台管理接口。
servers:
  - url: http://localhost:4401
    description: 本地开发默认地址
tags:
  - name: System
  - name: Comments
  - name: Captcha
  - name: Page Feedback
  - name: Admin Session
  - name: Admin Comments
  - name: Admin Pages
  - name: Admin Users
  - name: Admin Visitors
  - name: Admin Blacklist
  - name: Admin Sites
  - name: Admin Site Settings
paths:
  /healthz:
    get:
      tags: [System]
      summary: 健康检查
      operationId: getHealthz
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthzResponse'
  /api/comments/bootstrap:
    get:
      tags: [Comments]
      summary: 获取 FangYuan 首屏评论 bootstrap 数据
      operationId: getCommentsBootstrap
      parameters:
        - $ref: '#/components/parameters/SiteKey'
        - $ref: '#/components/parameters/PageKey'
        - $ref: '#/components/parameters/PageTitleOptional'
        - $ref: '#/components/parameters/PageUrlOptional'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 评论 bootstrap 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
  /api/comments/thread:
    get:
      tags: [Comments]
      summary: 获取评论线程分页
      operationId: getCommentsThread
      parameters:
        - $ref: '#/components/parameters/SiteKey'
        - $ref: '#/components/parameters/PageKey'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 评论线程成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
  /api/comments:
    post:
      tags: [Comments]
      summary: 创建评论
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '200':
          description: 评论创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCommentResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
  /api/comments/{commentId}/vote:
    post:
      tags: [Comments]
      summary: 对评论投票
      operationId: voteComment
      parameters:
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteCommentRequest'
      responses:
        '200':
          description: 投票成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteCommentResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
  /api/comments/captcha/state:
    get:
      tags: [Captcha]
      summary: 获取当前页面验证码状态
      operationId: getCaptchaState
      parameters:
        - $ref: '#/components/parameters/SiteKey'
        - $ref: '#/components/parameters/PageKey'
        - $ref: '#/components/parameters/PageTitleOptional'
        - $ref: '#/components/parameters/PageUrlOptional'
      responses:
        '200':
          description: 验证码状态成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaStateResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
  /api/comments/captcha/refresh:
    post:
      tags: [Captcha]
      summary: 刷新当前页面验证码 challenge
      operationId: refreshCaptcha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptchaRefreshRequest'
      responses:
        '200':
          description: 验证码 challenge 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaStateResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
  /api/comments/captcha/widget:
    get:
      tags: [Captcha]
      summary: 返回当前 challenge 的验证码组件宿主页
      operationId: getCaptchaWidget
      parameters:
        - $ref: '#/components/parameters/SiteKey'
        - $ref: '#/components/parameters/PageKey'
        - name: challengeId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 验证码组件 HTML
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
  /api/comments/captcha/complete:
    post:
      tags: [Captcha]
      summary: 完成 iframe 组件验证码并写回当前 captcha session
      operationId: completeCaptcha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptchaCompleteRequest'
      responses:
        '200':
          description: iframe 验证码校验成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaVerifyResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
  /api/comments/captcha/verify:
    post:
      tags: [Captcha]
      summary: 验证当前页面验证码
      operationId: verifyCaptcha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptchaVerifyRequest'
      responses:
        '200':
          description: 验证码校验成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaVerifyResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
  /api/page-feedback/like:
    post:
      tags: [Page Feedback]
      summary: 对页面点赞
      operationId: likePage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageLikeRequest'
      responses:
        '200':
          description: 页面点赞成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageLikeResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
  /api/admin/session/captcha:
    get:
      tags: [Admin Session]
      summary: 获取管理员登录验证码
      operationId: adminCaptcha
      responses:
        '200':
          description: 管理员登录验证码
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCaptchaChallengeResponse'
        '403':
          $ref: '#/components/responses/Error403'
  /api/admin/session/login:
    post:
      tags: [Admin Session]
      summary: 管理后台登录
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /api/admin/session/logout:
    post:
      tags: [Admin Session]
      summary: 管理后台登出
      operationId: adminLogout
      security:
        - AdminSessionCookie: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLogoutResponse'
  /api/admin/session/me:
    get:
      tags: [Admin Session]
      summary: 获取当前后台会话信息
      operationId: adminMe
      security:
        - AdminSessionCookie: []
      responses:
        '200':
          description: 当前后台会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeResponse'
        '401':
          $ref: '#/components/responses/Error401'
  /api/admin/comments:
    get:
      tags: [Admin Comments]
      summary: 列出后台评论
      operationId: listAdminComments
      security:
        - AdminSessionCookie: []
      parameters:
        - name: siteKey
          in: query
          schema:
            type: string
        - name: pageKey
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved]
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 评论列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommentsListResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
  /api/admin/comments/{commentId}:
    patch:
      tags: [Admin Comments]
      summary: 更新评论状态或展示属性
      operationId: updateAdminComment
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCommentPatchRequest'
      responses:
        '200':
          description: 评论更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommentMutationResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
    delete:
      tags: [Admin Comments]
      summary: 软删除评论
      operationId: deleteAdminComment
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CommentId'
      responses:
        '200':
          description: 评论删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommentMutationResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
  /api/admin/pages:
    get:
      tags: [Admin Pages]
      summary: 列出页面管理聚合数据
      operationId: listAdminPages
      security:
        - AdminSessionCookie: []
      parameters:
        - name: siteKey
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 页面管理列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPagesListResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
  /api/admin/users:
    get:
      tags: [Admin Users]
      summary: 按邮箱聚合列出用户视图
      operationId: listAdminUsers
      security:
        - AdminSessionCookie: []
      parameters:
        - name: siteKey
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 用户管理列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersListResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
  /api/admin/visitors:
    get:
      tags: [Admin Visitors]
      summary: 列出访客管理聚合数据
      operationId: listAdminVisitors
      security:
        - AdminSessionCookie: []
      parameters:
        - name: siteKey
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 访客管理列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVisitorsListResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
  /api/admin/blacklist:
    get:
      tags: [Admin Blacklist]
      summary: 列出黑名单规则
      operationId: listAdminBlacklist
      security:
        - AdminSessionCookie: []
      parameters:
        - name: siteKey
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 黑名单规则列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBlacklistListResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
    post:
      tags: [Admin Blacklist]
      summary: 创建黑名单规则
      operationId: createAdminBlacklistRule
      security:
        - AdminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBlacklistCreateRequest'
      responses:
        '200':
          description: 黑名单规则创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBlacklistMutationResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
  /api/admin/blacklist/{ruleId}:
    delete:
      tags: [Admin Blacklist]
      summary: 删除黑名单规则
      operationId: deleteAdminBlacklistRule
      security:
        - AdminSessionCookie: []
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 黑名单规则删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBlacklistMutationResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
  /api/admin/system-settings:
    get:
      tags: [Admin System Settings]
      summary: 获取全局系统设置
      operationId: getAdminSystemSettings
      security:
        - AdminSessionCookie: []
      responses:
        '200':
          description: 全局系统设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSystemSettingsResponse'
        '401':
          $ref: '#/components/responses/Error401'
    put:
      tags: [Admin System Settings]
      summary: 更新全局系统设置
      operationId: updateAdminSystemSettings
      security:
        - AdminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSystemSettingsUpdateRequest'
      responses:
        '200':
          description: 全局系统设置更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSystemSettingsResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
  /api/admin/sites:
    get:
      tags: [Admin Sites]
      summary: 列出站点总览与设置摘要
      operationId: listAdminSites
      security:
        - AdminSessionCookie: []
      responses:
        '200':
          description: 站点总览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSitesListResponse'
        '401':
          $ref: '#/components/responses/Error401'
    post:
      tags: [Admin Sites]
      summary: 创建站点
      operationId: createAdminSite
      security:
        - AdminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSiteCreateRequest'
      responses:
        '200':
          description: 站点创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSiteMutationResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
  /api/admin/sites/{siteKey}:
    patch:
      tags: [Admin Sites]
      summary: 更新站点基础信息
      operationId: updateAdminSite
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SiteKeyPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSitePatchRequest'
      responses:
        '200':
          description: 站点更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSiteMutationResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
  /api/admin/sites/{siteKey}/settings:
    get:
      tags: [Admin Site Settings]
      summary: 获取站点设置
      operationId: getAdminSiteSettings
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SiteKeyPath'
      responses:
        '200':
          description: 站点设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettingsResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
    put:
      tags: [Admin Site Settings]
      summary: 更新站点设置
      operationId: updateAdminSiteSettings
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SiteKeyPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSettingsUpdateRequest'
      responses:
        '200':
          description: 站点设置更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettingsResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
components:
  securitySchemes:
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: qingyan_admin
  parameters:
    SiteKey:
      name: siteKey
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    SiteKeyPath:
      name: siteKey
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PageKey:
      name: pageKey
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    PageTitleOptional:
      name: pageTitle
      in: query
      required: false
      schema:
        type: string
    PageUrlOptional:
      name: pageUrl
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            format: uri
          - type: string
            pattern: ^/
      description: 完整页面 URL，或去掉域名后的页面路径（如 `/posts/welcome/`）
    SortBy:
      name: sortBy
      in: query
      required: false
      schema:
        type: string
        enum: [newest, oldest]
        default: newest
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Error400:
      description: 请求参数无效或当前操作不满足前置条件
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error401:
      description: 认证失败或会话缺失
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: 当前请求被拒绝
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: 站点、评论、页面或设置不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error409:
      description: 当前资源状态冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error429:
      description: 触发频率限制
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthzResponse:
      type: object
      required: [service, status]
      properties:
        service:
          type: string
          example: QingYan
        status:
          type: string
          example: ok
    ErrorObject:
      type: object
      required: [code, message, requestId, details]
      properties:
        code:
          type: string
          example: COMMENT_CAPTCHA_REQUIRED
        message:
          type: string
        requestId:
          type: string
        details:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
    CommentCapability:
      type: object
      required:
        - enabled
        - supportsReply
        - supportsVote
        - supportsCaptcha
        - defaultStatus
        - message
