openapi: 3.1.0
info:
  title: QingYan API
  version: 0.1.0
  description: |
    QingYan 是一个面向内容站点的第一方评论后端。

    当前规格以仓库内已经实现并通过自动化验证的接口为准，覆盖公开评论接口、页面点赞接口、验证码接口和 Web Upgrade Mode 最小接口。

    `/api/admin/*` 属于 QingYan 自带 Admin Console 的管理接口，不进入公开 OpenAPI；这些接口可以随内置后台一起演进。开发者调试或扩展内置后台时可参考 `docs/admin-console-api.md`，但第三方站点前端不建议把它当作公开稳定合同依赖。
servers:
  - url: http://localhost:4401
    description: 本地开发默认地址
tags:
  - name: System
  - name: Comments
  - name: Notifications
  - name: Captcha
  - name: Page Feedback
  - name: Upgrade
paths:
  /healthz:
    get:
      tags: [System]
      summary: 健康检查
      operationId: getHealthz
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthzResponse'
  /api/comments/bootstrap:
    get:
      tags: [Comments]
      summary: 获取 FangYuan 首屏评论 bootstrap 数据
      operationId: getCommentsBootstrap
      parameters:
        - $ref: '#/components/parameters/SiteKey'
        - $ref: '#/components/parameters/PageKey'
        - $ref: '#/components/parameters/PageTitleOptional'
        - $ref: '#/components/parameters/PageUrlOptional'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 评论 bootstrap 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
  /api/comments/thread:
    get:
      tags: [Comments]
      summary: 获取评论线程分页
      operationId: getCommentsThread
      parameters:
        - $ref: '#/components/parameters/SiteKey'
        - $ref: '#/components/parameters/PageKey'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: 评论线程成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
  /api/comments:
    post:
      tags: [Comments]
      summary: 创建评论
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '200':
          description: 评论创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCommentResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
  /api/comments/{commentId}/vote:
    post:
      tags: [Comments]
      summary: 对评论投票
      operationId: voteComment
      parameters:
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteCommentRequest'
      responses:
        '200':
          description: 投票成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteCommentResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
  /api/comments/captcha/state:
    get:
      tags: [Captcha]
      summary: 获取当前页面验证码状态
      operationId: getCaptchaState
      parameters:
        - $ref: '#/components/parameters/SiteKey'
        - $ref: '#/components/parameters/PageKey'
        - $ref: '#/components/parameters/PageTitleOptional'
        - $ref: '#/components/parameters/PageUrlOptional'
      responses:
        '200':
          description: 验证码状态成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaStateResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
  /api/comments/captcha/refresh:
    post:
      tags: [Captcha]
      summary: 刷新当前页面验证码 challenge
      operationId: refreshCaptcha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptchaRefreshRequest'
      responses:
        '200':
          description: 验证码 challenge 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaStateResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
  /api/comments/captcha/widget:
    get:
      tags: [Captcha]
      summary: 返回当前 challenge 的验证码组件宿主页
      operationId: getCaptchaWidget
      parameters:
        - $ref: '#/components/parameters/SiteKey'
        - $ref: '#/components/parameters/PageKey'
        - name: challengeId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 验证码组件 HTML
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
  /api/comments/captcha/complete:
    post:
      tags: [Captcha]
      summary: 完成 iframe 组件验证码并写回当前 captcha session
      operationId: completeCaptcha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptchaCompleteRequest'
      responses:
        '200':
          description: iframe 验证码校验成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaVerifyResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
  /api/comments/captcha/verify:
    post:
      tags: [Captcha]
      summary: 验证当前页面验证码
      operationId: verifyCaptcha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptchaVerifyRequest'
      responses:
        '200':
          description: 验证码校验成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaVerifyResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
  /api/page-feedback/like:
    post:
      tags: [Page Feedback]
      summary: 对页面点赞
      operationId: likePage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageLikeRequest'
      responses:
        '200':
          description: 页面点赞成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageLikeResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
  /notifications/unsubscribe:
    get:
      tags: [Notifications]
      summary: 退订普通评论者回复邮件通知
      operationId: unsubscribeCommenterNotifications
      description: |
        使用邮件中的一次性退订 token 关闭对应普通评论者邮箱在对应站点的回复通知。数据库只保存 token hash；明文 token 只出现在邮件链接中。无效、过期或已消费 token 返回 404。
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 退订成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsubscribeResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
  /api/upgrade/state:
    get:
      tags: [Upgrade]
      summary: 获取 Web Upgrade Mode 状态
      operationId: getUpgradeState
      responses:
        '200':
          description: 当前升级状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeStateResponse'
  /api/upgrade/apply:
    post:
      tags: [Upgrade]
      summary: 执行确认后的 Web upgrade
      operationId: applyUpgrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeApplyRequest'
      responses:
        '200':
          description: 升级执行完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeApplyResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
components:
  parameters:
    SiteKey:
      name: siteKey
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    SiteKeyPath:
      name: siteKey
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PageKey:
      name: pageKey
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    PageTitleOptional:
      name: pageTitle
      in: query
      required: false
      schema:
        type: string
    PageUrlOptional:
      name: pageUrl
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            format: uri
          - type: string
            pattern: ^/
      description: 完整页面 URL，或去掉域名后的页面路径（如 `/posts/welcome/`）
    SortBy:
      name: sortBy
      in: query
      required: false
      schema:
        type: string
        enum: [newest, oldest]
        default: newest
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Error400:
      description: 请求参数无效或当前操作不满足前置条件
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error401:
      description: 认证失败或会话缺失
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: 当前请求被拒绝
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: 站点、评论、页面或设置不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error409:
      description: 当前资源状态冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error429:
      description: 触发频率限制
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthzResponse:
      type: object
      required: [service, status]
      properties:
        service:
          type: string
          example: QingYan
        status:
          type: string
          example: ok
    ErrorObject:
      type: object
      required: [code, message, requestId, details]
      properties:
        code:
          type: string
          example: COMMENT_CAPTCHA_REQUIRED
        message:
          type: string
        requestId:
          type: string
        details:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
    UnsubscribeResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [unsubscribed]
    UpgradePlan:
      type: object
      required:
        - currentVersion
        - targetVersion
        - schemaMigrations
        - applicationUpgrades
        - configChanges
        - dbSettingChanges
        - secretHandling
        - backupPaths
        - risks
      properties:
        currentVersion:
          type: string
        targetVersion:
          type: string
        schemaMigrations:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
              description:
                type: string
        applicationUpgrades:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
              fromVersion:
                type: string
              toVersion:
                type: string
              summary:
                type: object
                additionalProperties: true
        configChanges:
          type: array
          items:
            type: object
            additionalProperties: true
        dbSettingChanges:
          type: array
          items:
            type: object
            additionalProperties: true
        secretHandling:
          type: array
          items:
            type: string
        backupPaths:
          type: object
          additionalProperties: true
        risks:
          type: array
          items:
            type: string
    PartialUpgradeMarker:
      type: object
      required:
        - kind
        - startedAt
        - fromVersion
        - toVersion
        - planPath
        - backupDirectory
        - currentStep
      properties:
        kind:
          type: string
          const: qingyan_partial_upgrade
        startedAt:
          type: string
        fromVersion:
          type: string
        toVersion:
          type: string
        planPath:
          type: string
        backupDirectory:
          type: string
        currentStep:
          type: string
        error:
          type: string
    UpgradeStateResponse:
      oneOf:
        - type: object
          required: [state, plan]
          properties:
            state:
              type: string
              const: upgrade_required
            plan:
              $ref: '#/components/schemas/UpgradePlan'
        - type: object
          required: [state, reason, recovery]
          properties:
            state:
              type: string
              const: recovery_required
            reason:
              type: string
            recovery:
              oneOf:
                - $ref: '#/components/schemas/PartialUpgradeMarker'
                - type: 'null'
        - type: object
          required: [state, reason]
          properties:
            state:
              type: string
              const: broken_config
            reason:
              type: string
        - type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [normal_current, not_installed]
    UpgradeApplyRequest:
      type: object
      required: [confirm]
      properties:
        token:
          type: string
          description: 可选；浏览器流程通常通过 HttpOnly cookie 提供
        confirm:
          type: string
          const: UPGRADE QINGYAN
        backupDirectory:
          type: string
    UpgradeApplyResponse:
      type: object
      required: [state, backup, applied, restartRequired]
      properties:
        state:
          type: string
          const: applied
        backup:
          type: object
          additionalProperties: true
        applied:
          type: object
          required: [schemaMigrations, applicationUpgrades]
          properties:
            schemaMigrations:
              type: array
              items:
                type: string
            applicationUpgrades:
              type: array
              items:
                type: string
        restartRequired:
          type: boolean
    CommentForm:
      type: object
      required: [allow, require]
      properties:
        allow:
          type: array
          items:
            type: string
            enum: [nickname, email, website]
        require:
          type: array
          items:
            type: string
            enum: [nickname, email, website]
    CommentPagination:
      type: object
      required: [sortBy, limit, offset, totalCount, rootCount]
      properties:
        sortBy:
          type: string
          enum: [newest, oldest]
        limit:
          type: integer
        offset:
          type: integer
        totalCount:
          type: integer
        rootCount:
          type: integer
    CommentAuthor:
      type: object
      required: [name]
      properties:
        name:
          type: string
        website:
          type:
            - string
            - 'null'
          format: uri
        avatarUrl:
          type: string
          format: uri
          description: Optional external avatar image URL generated from the comment author email. QingYan does not host, proxy, cache, upload, or guarantee avatar files.
        badge:
          type: object
          required: [label]
          properties:
            label:
              type: string
          description: Optional trusted author badge. The label is resolved from current site settings and is only emitted for verified comments. Verified comment names may follow current staff profile settings or the stored comment snapshot depending on site configuration; ordinary visitor comments always use the stored snapshot name.
    CommentContent:
      type: object
      required: [raw, html]
      properties:
        raw:
          type: string
        html:
          type: string
    CommentDisplayLocation:
      type: object
      required: [label, precision]
      properties:
        label:
          type: string
        precision:
          type: string
          enum: [country, province, city]
    CommentDisplayDevice:
      type: object
      required: [browser, browserVersion, os, osVersion, type]
      properties:
        browser:
          type: string
          enum: [chrome, edge, firefox, safari, opera, samsung, wechat, unknown]
        browserVersion:
          type:
            - string
            - 'null'
        os:
          type: string
          enum: [windows, macos, ios, android, linux, unknown]
        osVersion:
          type:
            - string
            - 'null'
        type:
          type: string
          enum: [desktop, mobile, tablet, bot, unknown]
    CommentDisplayMeta:
      type: object
      description: Public display metadata derived from stored author IP and authorUserAgent when the site enables metadata collection. Raw author IP and User-Agent values are not exposed by public comment responses.
      properties:
        location:
          $ref: '#/components/schemas/CommentDisplayLocation'
        device:
          $ref: '#/components/schemas/CommentDisplayDevice'
    CommentAvatarDisplay:
      type: object
      required: [external]
      description: Avatar metadata for public comment frontends. QingYan may emit third-party author.avatarUrl and does not host avatar images. Optional display hints are returned only when publicApi.advisoryFields.enabled is true.
      properties:
        external:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
              description: Whether public comments may include author.avatarUrl.
        display:
          type: object
          required: [shape, sizePx]
          description: Optional frontend display hints. These are advisory settings, not authoritative layout requirements.
          properties:
            shape:
              type: string
              enum: [circle, rounded, square]
            sizePx:
              type: integer
              minimum: 16
              maximum: 256
    CommentDisplay:
      type: object
      required: [avatar]
      properties:
        avatar:
          $ref: '#/components/schemas/CommentAvatarDisplay'
    PublicComment:
      type: object
      required:
        - id
        - author
        - content
        - status
        - isPinned
        - isFolded
        - replyCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        parentId:
          type:
            - string
            - 'null'
        author:
          $ref: '#/components/schemas/CommentAuthor'
        content:
          $ref: '#/components/schemas/CommentContent'
        displayMeta:
          $ref: '#/components/schemas/CommentDisplayMeta'
        status:
          type: string
          enum: [pending, approved]
          description: Public responses never expose internal spam/trash states. Comments stored as spam or trash are hidden from public thread lists, and create responses normalize non-approved internal states to pending.
        isPinned:
          type: boolean
        isFolded:
          type: boolean
        replyCount:
          type: integer
        vote:
          $ref: '#/components/schemas/CommentVote'
        createdAt:
          type:
            - string
            - 'null'
          format: date-time
        updatedAt:
          type:
            - string
            - 'null'
          format: date-time
        children:
          type: array
          items:
            $ref: '#/components/schemas/PublicComment'
    CommentVote:
      type: object
      required: [up, down]
      properties:
        up:
          type: integer
        down:
          type: integer
        viewer:
          type: string
          enum: [up, down]
    FeatureDisabledReason:
      type: string
      enum:
        - site_disabled
        - page_inactive
        - comments_disabled
        - feature_disabled
        - unsupported
    FeatureFlag:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        reason:
          $ref: '#/components/schemas/FeatureDisabledReason'
    PublicFeatures:
      type: object
      required:
        - comments
        - commentReplies
        - commentVotes
        - commentCaptcha
        - pageViews
        - pageLikes
        - visitors
      properties:
        comments:
          $ref: '#/components/schemas/FeatureFlag'
        commentReplies:
          allOf:
            - $ref: '#/components/schemas/FeatureFlag'
            - type: object
              properties:
                maxDepth:
                  type: integer
        commentVotes:
          $ref: '#/components/schemas/FeatureFlag'
        commentCaptcha:
          allOf:
            - $ref: '#/components/schemas/FeatureFlag'
            - type: object
              properties:
                mode:
                  type: string
                  enum: [never, always, threshold]
        pageViews:
          $ref: '#/components/schemas/FeatureFlag'
        pageLikes:
          $ref: '#/components/schemas/FeatureFlag'
        visitors:
          $ref: '#/components/schemas/FeatureFlag'
    BootstrapSite:
      type: object
      required: [siteKey]
      properties:
        siteKey:
          type: string
    BootstrapPage:
      type: object
      required: [pageKey, status]
      properties:
        pageKey:
          type: string
        status:
          type: string
    BootstrapData:
      type: object
      properties:
        comments:
          $ref: '#/components/schemas/BootstrapCommentsData'
        pageViews:
          $ref: '#/components/schemas/BootstrapPageViewsData'
        pageLikes:
          $ref: '#/components/schemas/BootstrapPageLikesData'
    BootstrapCommentsData:
      type: object
      required: [form, display, pagination, items]
      properties:
        form:
          $ref: '#/components/schemas/CommentForm'
        display:
          $ref: '#/components/schemas/CommentDisplay'
        pagination:
          $ref: '#/components/schemas/CommentPagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicComment'
        captcha:
          $ref: '#/components/schemas/CaptchaStateResponse'
    BootstrapPageViewsData:
      type: object
      required: [count]
      properties:
        count:
          type: integer
    BootstrapPageLikesData:
      type: object
      required: [count, liked]
      properties:
        count:
          type: integer
        liked:
          type: boolean
    InlineValueCaptchaChallenge:
      type: object
      required: [challengeId, mode, imageData]
      properties:
        challengeId:
          type: string
        mode:
          type: string
          const: inline_value
        imageData:
          type: string
          description: data URL 形式的 SVG 图片
