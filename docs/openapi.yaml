        name:
          type: string
          minLength: 1
        allowedOrigins:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
    AdminSitePatchRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        allowedOrigins:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
    AdminSiteMutationResponse:
      type: object
