server:
  host: 0.0.0.0
  port: 4401
  publicBaseUrl: http://localhost:4401
  publicPath: /qingyan
  trustProxy: false

database:
  url: postgresql://qingyan:change-me@postgres:5432/qingyan
  pool:
    max: 5
    connectionTimeoutMs: 5000
    idleTimeoutMs: 30000
  # 远程连接可启用 TLS，证书内容也可通过对应环境变量传入。
  # tls:
  #   rejectUnauthorized: true

admin:
  session:
    cookieName: qingyan_admin
    ttlMinutes: 1440
    sameSite: lax
    secure: false

security:
  requestIdHeader: x-request-id
  globalFloodGuard:
    enabled: false
    windowSec: 10
    maxRequests: 120
  publicOriginGuard:
    enabled: true
    allowMissingOrigin: false
  adminOriginGuard:
    enabled: true
    allowMissingOrigin: false
    allowedOrigins: []
  rateLimit:
    adminLogin:
      windowSec: 600
      maxFailures: 5
      autoBlacklistSec: 1800
    commentCreate:
      windowSec: 300
      maxRequests: 5
    commentVote:
      windowSec: 300
      maxRequests: 15
    captchaVerify:
      windowSec: 300
      maxFailures: 8
    pageLike:
      windowSec: 300
      maxRequests: 10
