server:
  host: 0.0.0.0
  port: 4401
  publicBaseUrl: http://localhost:4401
  trustProxy: false

database:
  client: sqlite
  sqlite:
    file: ./data/qingyan.db

admin:
  tokenHash: "<replace-with-argon2id-hash>"
  session:
    cookieName: qingyan_admin
    ttlMinutes: 1440
    sameSite: lax
    secure: false

security:
  requestIdHeader: x-request-id
  globalFloodGuard:
    enabled: false
    windowSec: 10
    maxRequests: 120
  rateLimit:
    adminLogin:
      windowSec: 600
      maxFailures: 10
      autoBlacklistSec: 3600
    commentCreate:
      windowSec: 300
      maxRequests: 5
    commentVote:
      windowSec: 300
      maxRequests: 15
    captchaVerify:
      windowSec: 300
      maxFailures: 8
    pageLike:
      windowSec: 300
      maxRequests: 10

captcha:
  provider: image
  image:
    width: 160
    height: 60
    ttlSec: 600

mail:
  enabled: false
  smtp:
    host: smtp.example.com
    port: 465
    secure: true
    username: notify@example.com
    password: "<secret>"
    from: notify@example.com

sites:
  - siteKey: fangyuan
    name: FangYuan
    allowedOrigins:
      - http://localhost:4321
    defaults:
      comments:
        enabled: true
        defaultStatus: pending
        maxDepth: 3
        rootLimit: 20
        captcha:
          mode: threshold
          thresholdWindowSec: 60
          thresholdMaxActions: 3
        abuseGuard:
          enabled: true
          windowSec: 600
          maxWriteActions: 100
          autoBlacklist:
            enabled: true
            scope: post
            ttlSec: 1800
        requireEmail: false
        allowWebsite: true
      pageFeedback:
        allowLike: true
      notifications:
        emailEnabled: false
