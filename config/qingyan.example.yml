server:
  host: 0.0.0.0
  port: 4401
  publicBaseUrl: http://localhost:4401
  trustProxy: false

database:
  client: sqlite
  sqlite:
    file: ./data/qingyan.db

admin:
  tokenHash: "<replace-with-argon2id-hash>"
  session:
    cookieName: qingyan_admin
    ttlMinutes: 1440
    sameSite: lax
    secure: false

security:
  requestIdHeader: x-request-id
  globalFloodGuard:
    enabled: false
    windowSec: 10
    maxRequests: 120
  publicOriginGuard:
    enabled: true
    allowMissingOrigin: false
  rateLimit:
    adminLogin:
      windowSec: 600
      maxFailures: 5
    commentCreate:
      windowSec: 300
      maxRequests: 5
    commentVote:
      windowSec: 300
      maxRequests: 15
    captchaVerify:
      windowSec: 300
      maxFailures: 8
    pageLike:
      windowSec: 300
      maxRequests: 10

captcha:
  image:
    width: 160
    height: 60
    ttlSec: 600
  provider: image
  # turnstile:
  #   siteKey: "1x00000000000000000000AA"
  #   secretKey: "<turnstile-secret>"
  #   expectedAction: COMMENT_SUBMIT
  #   expectedHostname: comments.example.com
  # hcaptcha:
  #   siteKey: "<hcaptcha-site-key>"
  #   secretKey: "<hcaptcha-secret>"
  #   expectedHostname: comments.example.com
  # recaptcha:
  #   variant: score_based
  #   projectId: "<gcp-project>"
  #   siteKey: "<recaptcha-site-key>"
  #   apiKey: "<gcp-api-key>"
  #   expectedAction: COMMENT_SUBMIT
  #   expectedHostname: comments.example.com
  #   minScore: 0.5
  # geetest:
  #   captchaId: "<captcha-id>"
  #   captchaKey: "<captcha-key>"
  #   apiServer: https://gcaptcha4.geetest.com

logging:
  directory: ./logs
  defaults:
    level: info
    retentionDays: 7

mail:
  enabled: false
  smtp:
    host: smtp.example.com
    port: 465
    secure: true
    username: notify@example.com
    password: "<secret>"
    from: notify@example.com

sites:
  - siteKey: fangyuan
    name: FangYuan
    allowedOrigins:
      - http://localhost:4321
    defaults:
      comments:
        enabled: true
        defaultStatus: pending
        maxDepth: 3
        rootLimit: 20
        identity:
          require:
            - nickname
            - email
        captcha:
          mode: threshold
          thresholdWindowSec: 60
          thresholdMaxActions: 3
        abuseGuard:
          enabled: true
          windowSec: 600
          maxWriteActions: 100
          autoBlacklist:
            enabled: true
            scope: post
            ttlSec: 1800
        allowWebsite: true
      pageFeedback:
        allowLike: true
      notifications:
        emailEnabled: false
